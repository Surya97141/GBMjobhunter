name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails on errors only; warnings (e.g. unused variables) are reported but allowed.
      - run: npm run lint

      # Service tests mock Postgres and Redis, so no service containers needed.
      - run: npm test

      - run: npm run build
